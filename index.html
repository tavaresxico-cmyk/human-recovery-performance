<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An evidence-led system that turns recovery strategies into sustainable performance." />
    <link rel="icon" href="/favicon.svg" />
    <title>Human Recovery Performance System</title>
    <script type="module" crossorigin src="/assets/index-h5bWA_Cb.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BqbU86s8.css">
    <link rel="stylesheet" href="/assets/mobile-fixes.css?v=20260728">
    <style>
      .button-acid > span[aria-hidden="true"] {
        position: relative;
        display: inline-block;
        flex: 0 0 17px;
        width: 17px;
        height: 17px;
        overflow: visible;
        color: currentColor;
        font-size: 0;
        line-height: 1;
        transform: none;
      }

      .button-acid > span[aria-hidden="true"]::before {
        content: "";
        position: absolute;
        right: 1px;
        bottom: 2px;
        width: 13px;
        height: 2px;
        border-radius: 2px;
        background: currentColor;
        transform: rotate(-45deg);
        transform-origin: right center;
      }

      .button-acid > span[aria-hidden="true"]::after {
        content: "";
        position: absolute;
        top: 1px;
        right: 1px;
        width: 8px;
        height: 8px;
        border-top: 2px solid currentColor;
        border-right: 2px solid currentColor;
      }

      @media (max-width: 560px) {
        .button-primary > span[aria-hidden="true"],
        .nav-cta > span[aria-hidden="true"] {
          display: inline-grid;
          place-items: center;
          width: 22px;
          overflow: hidden;
          color: #477116;
          font-family: Arial, Helvetica, sans-serif;
          font-size: 0;
          font-weight: 400;
          line-height: 1;
        }

        .button-primary > span[aria-hidden="true"]::before,
        .nav-cta > span[aria-hidden="true"]::before {
          content: "→";
          font-size: 20px;
        }

        .audience-tabs {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 4px;
          overflow: visible;
        }

        .audience-tabs button {
          justify-content: center;
          width: auto;
          min-width: 0;
          min-height: 68px;
          padding: 10px 7px;
          border-right: 1px solid #40514c;
          font-size: clamp(10px, 3.15vw, 13px);
          line-height: 1.15;
          text-align: center;
        }

        .audience-tabs button:last-child {
          border-right: 1px solid #40514c;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const email = "tavaresxico@gmail.com";
        const updateContact = () => {
          const button = document.querySelector(".contact-card .button-acid");
          const note = document.querySelector(".contact-card small");
          if (!button) return;
          const isPortuguese = document.documentElement.lang === "pt";
          const subject = isPortuguese
            ? "Human Recovery Performance System — Agendar conversa"
            : "Human Recovery Performance System — Schedule a conversation";
          button.href = `mailto:${email}?subject=${encodeURIComponent(subject)}`;
          button.setAttribute(
            "aria-label",
            isPortuguese
              ? "Enviar email a Francisco Tavares para agendar uma conversa"
              : "Email Francisco Tavares to schedule a conversation"
          );
          if (note) note.textContent = email;
        };
        const observer = new MutationObserver(updateContact);
        observer.observe(document.documentElement, {
          attributes: true,
          attributeFilter: ["lang"],
          childList: true,
          subtree: true
        });
        updateContact();
      })();
    </script>
  </body>
</html>
